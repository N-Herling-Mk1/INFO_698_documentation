<h2>Project Video</h2>
<p>
  The FORGE project commercial. Switch between the local HD version and the
  YouTube upload below.
</p>

<div class="seg-toggle" role="tablist" aria-label="Video source">
  <button class="seg-btn active" data-src="local"   role="tab" aria-selected="true">HD &middot; Local</button>
  <button class="seg-btn"        data-src="youtube" role="tab" aria-selected="false">YouTube</button>
</div>

<p class="seg-note" id="vidnote">
  Playing the local HD version &mdash; this renders noticeably clearer than the YouTube upload.
</p>

<div class="embed-wrapper embed-16x9">
  <iframe id="vidframe"
    src="assets/video/forge_commercial%20(6).html"
    title="FORGE &mdash; Project Commercial"
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen></iframe>
</div>

<div class="download-row">
  <a id="vidlink" class="btn btn-secondary"
     href="https://www.youtube.com/watch?v=B07DZg09ixg"
     target="_blank" rel="noopener noreferrer">Watch on YouTube &#8599;</a>
</div>

<script>
(function () {
  var SOURCES = {
    local:   "assets/video/forge_commercial%20(6).html",
    youtube: "https://www.youtube-nocookie.com/embed/B07DZg09ixg?rel=0&modestbranding=1"
  };
  var NOTES = {
    local:   "Playing the local HD version \u2014 this renders noticeably clearer than the YouTube upload.",
    youtube: "Playing the YouTube upload \u2014 the local HD version above renders clearer."
  };
  var frame = document.getElementById("vidframe");
  var note  = document.getElementById("vidnote");
  var btns  = document.querySelectorAll(".seg-toggle .seg-btn");
  btns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      var key = btn.getAttribute("data-src");
      if (frame.getAttribute("data-current") === key) return;
      frame.setAttribute("data-current", key);
      frame.src = SOURCES[key];
      note.textContent = NOTES[key];
      btns.forEach(function (b) {
        var on = b === btn;
        b.classList.toggle("active", on);
        b.setAttribute("aria-selected", on ? "true" : "false");
      });
    });
  });
  frame.setAttribute("data-current", "local");
})();
</script>
