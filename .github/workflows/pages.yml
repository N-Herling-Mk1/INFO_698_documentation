name: Deploy to GitHub Pages

# Deploys the static site. LaTeX source pushes (*.tex / *.sty) are handled by
# build-latex.yml instead — it compiles the PDFs AND deploys — so they are
# ignored here to avoid two deploys racing for the same Pages environment.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.tex'
      - '**.sty'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
