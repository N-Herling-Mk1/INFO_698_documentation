name: Build LaTeX & Deploy

# Compiles every *.tex in assets/docs to PDF and deploys the site. The freshly
# built PDFs go live because they're included in the Pages artifact below
# (path: .) — they are NOT committed back to the repo, so this workflow never
# pushes to main and never races your own pushes.
#
# pages.yml still handles pushes that only touch site content (html/css/js).

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.sty'
      - '.github/workflows/build-latex.yml'
  workflow_dispatch:

permissions:
  contents: read       # checkout only; nothing is committed back anymore
  pages: write         # deploy
  id-token: write       # deploy

concurrency:
  group: "pages"       # shared with pages.yml so deploys never overlap
  cancel-in-progress: false

# Fixed timestamp => deterministic, reproducible PDF metadata.
env:
  SOURCE_DATE_EPOCH: "1717200000"
  FORCE_SOURCE_DATE: "1"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile all .tex in assets/docs
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: assets/docs
          root_file: "*.tex"
          glob_root_file: true
          # latexmk (the default) runs pdflatex enough times to resolve the TOC.

      - name: Remove LaTeX aux files (keep the site clean)
        run: |
          cd assets/docs
          rm -f *.aux *.log *.out *.toc *.fls *.fdb_latexmk *.synctex.gz *.lof *.lot

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
